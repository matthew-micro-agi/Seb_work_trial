# Prometheus for the tiles (PLAN_ORCH.md §6): every tile's /metrics once a second. The targets come from
# targets.json, written by `python3 -m orch targets --write orch/targets.json` from the same node list orch
# uses, so the list has one home.
#
#   docker run --rm --network host -v "$PWD/orch:/etc/prometheus:ro" prom/prometheus     # http://localhost:9090
global:
  scrape_interval: 1s
  scrape_timeout: 1s
scrape_configs:
  - job_name: tiles
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets.json"]
        refresh_interval: 10s
